<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Sporer</title>
  <!--
    The app's icon: the stop pin of the map at the end of a route drawn in the colours of the modes (walk, cycle, drive).
    A square with no rounded corners and no transparency, which the platforms mask and fill as they like (iOS rounds the
    corners of the apple touch icon itself and fills transparency with black); everything that matters lies inside the
    circle of radius 205 round the middle (the safe zone of a maskable icon: 40 % of the side). The PNGs of the manifest and
    of iOS are drawn from this file by scripts/make-icons.mjs.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e" />
      <stop offset="1" stop-color="#141416" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />

  <g fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M142 372 C 150 334 188 322 214 342" stroke="#34C759" />
    <path d="M214 342 C 236 359 252 372 278 362" stroke="#30B0C7" />
    <path d="M278 362 C 296 355 308 344 318 330" stroke="#007AFF" />
  </g>
  <circle cx="142" cy="372" r="21" fill="#ffffff" />
  <circle cx="142" cy="372" r="9" fill="#34C759" />

  <path
    fill="#FF375F"
    fill-rule="evenodd"
    d="M318 336 C 318 336 238 266 238 204 A 80 80 0 0 1 398 204 C 398 266 318 336 318 336 Z M318 176 A 30 30 0 1 0 318 236 A 30 30 0 1 0 318 176 Z"
  />
</svg>
