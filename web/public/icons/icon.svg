<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Sporer</title>
  <!--
    The app's icon: the pink stop pin of the map over the faint contour lines of a map, with a trail of dots leading to it in
    the colours of the modes (walk, cycle, drive). A square with no rounded corners and no transparency, which the platforms
    mask and fill as they like (iOS rounds the corners itself and fills transparency with black); everything that matters lies
    inside the circle of radius 205 round the middle (the safe zone of a maskable icon: 40 % of the side). The PNGs of the
    manifest, of iOS and of the native app are drawn from this file by scripts/make-icons.mjs.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243447" />
      <stop offset="1" stop-color="#101820" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />

  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6">
    <path d="M-20 120 C 80 80 160 150 260 110 S 440 60 540 100" />
    <path d="M-20 200 C 90 160 170 230 270 190 S 450 140 540 180" />
    <path d="M-20 290 C 100 250 180 320 280 280 S 460 230 540 270" />
    <path d="M-20 380 C 110 340 190 410 290 370 S 470 320 540 360" />
    <path d="M-20 470 C 120 430 200 500 300 460 S 480 410 540 450" />
  </g>

  <circle cx="134" cy="406" r="13" fill="#34C759" />
  <circle cx="176" cy="386" r="13" fill="#34C759" />
  <circle cx="218" cy="382" r="13" fill="#30B0C7" />
  <circle cx="256" cy="370" r="13" fill="#0A84FF" />

  <path
    fill="#FF375F"
    fill-rule="evenodd"
    d="M256 339 C 256 339 170 263 170 196 A 86 86 0 0 1 342 196 C 342 263 256 339 256 339 Z M256 164 A 32 32 0 1 0 256 228 A 32 32 0 1 0 256 164 Z"
  />
</svg>
