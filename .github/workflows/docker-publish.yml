name: Create Docker Image

on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
    paths:
      - src/**
      - tests/**
      - web/**
      - docker/dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldellisola/sporer

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The integration tests start TimescaleDB with Testcontainers, which uses the Docker on the runner.
      - name: Run tests
        run: dotnet test src/Sporer.sln

  # The web app's checks: types, unit tests and the browser tests. The browser tests draw the map with software WebGL (see
  # web/playwright.config.ts), which needs no GPU, so the runner as it is will do. They run in Chromium, and a smoke set of them
  # (the tests tagged @smoke, a few of each flow) also in WebKit, the engine of the owner's iPhone.
  web:
    runs-on: ubuntu-latest
    # The limit is for a run that hangs (a browser that never answers), which would otherwise sit for the six hours that a job is given;
    # it is set above what a green run takes, not near it. An estimate, to be replaced by the measured times of a run: Chromium's
    # tests alone took about 10 minutes of this job; the WebKit smoke set, 12 tests, adds about 3; the install of the browsers
    # (a cache miss) about 3; npm ci, the checks and the unit tests about 2. That is about 18, and 30 leaves room for a slow runner.
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # The version that package-lock.json has locked, which is the one whose browsers are needed: a new version of Playwright is new browsers.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # The browsers are downloaded (a few hundred megabytes) once for each version of Playwright, and kept here. The key names the version and not
      # the browsers: if a browser is added to the installs below, the key has to change with it, or a hit would not have it.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install the browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # What the cache holds is the browsers' files. The libraries that they need (fonts, GStreamer, GTK for WebKit and so on) are packages of the
      # system, which a fresh runner does not have: they are installed whether the browsers came from the cache or not.
      - name: Install the system packages of the cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # PW_WEBKIT adds the webkit project (see web/playwright.config.ts): the smoke set, in the same run and the same report as Chromium's tests.
      - name: Run browser tests
        env:
          PW_WEBKIT: "1"
        run: npm run e2e

      # The report holds the traces of the tests that failed, which is what a red run is diagnosed from.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  build:
    needs: [test, web]
    # A run started by hand (Run workflow) on a working branch checks the code, which is the test and web jobs, and builds no image: the image is
    # built and published only from main and from a version tag, and for a pull request it is built without being pushed. A push, a pull request and
    # a manual run on main or on a tag are as they were.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@main

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}
