name: Create Docker Image

on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
    paths:
      - src/**
      - tests/**
      - web/**
      - docker/dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldellisola/sporer

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The integration tests start TimescaleDB with Testcontainers, which uses the Docker on the runner.
      - name: Run tests
        run: dotnet test src/Sporer.sln

  # The web app's checks, in three kinds of job that run at the same time: web-checks (types and unit tests), e2e (the browser tests, split in
  # four jobs) and, only when an e2e job failed, e2e-report (the one report of them all). The browser tests draw the map with software WebGL (see
  # web/playwright.config.ts), which needs no GPU, so the runner as it is will do. They run in Chromium, and a smoke set of them (the tests
  # tagged @smoke, a few of each flow) also in WebKit, the engine of the owner's iPhone.
  web-checks:
    runs-on: ubuntu-latest
    # The limit is for a run that hangs, which would otherwise sit for the six hours that a job is given; it is set above what a green run takes,
    # not near it. Estimated, not yet measured: `npm ci`, the type check and the unit tests are about a minute and a half of the 12.7 minutes
    # that the single web job took (all but the browser tests, which were 10.8 and the browsers' 34 s), and 10 minutes is far above that.
    # The first run of this workflow has the numbers.
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  # The browser tests, in four jobs at once: Chromium's two projects (phone and desktop) in three shards, which Playwright cuts from the whole
  # list of tests (`--shard=i/3`; every test is in exactly one), and the WebKit smoke set in a job of its own. Each job has one worker (the config's
  # `workers` is 1 when CI is set): the verdict must not depend on how busy the runner is, and a job is a runner of its own, so the jobs do not
  # share processors. fail-fast is off: one red shard must not cancel the others, whose verdicts are as useful.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The limit is for a run that hangs (a browser that never answers), set above what a green run takes, not near it. Estimated, not yet
    # measured, from the run of the single web job (a cache miss, Chromium's 234 tests and the WebKit smoke set in one run): the browser tests
    # were 10.8 minutes in all, so about 9.5 for Chromium's tests and 1.3 for WebKit's, and a shard (a third of the tests, balanced by file) is
    # about 3.2 minutes of tests. Add what a job does before them: the checkout, `npm ci` and the browsers (34 s for both of them in a miss, more
    # for the system packages of a hit) and the production build that the web server runs first, about 1.5 minutes. A Chromium shard comes to
    # about 5 minutes and the WebKit job to about 4. 8 minutes is about one and a half times a shard; the WebKit job has the same limit, for
    # its install is the larger. The first run has the real numbers: set the limits from them.
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # name is what the checks list shows, id is for the artifact (its name cannot hold a slash), browser is what the job installs and
          # the cache's key names, args is what is added to `playwright test`, and save is the one job of its browser that saves the cache.
          - { name: "chromium 1/3", id: chromium-1, browser: chromium, args: "--shard=1/3", save: true }
          - { name: "chromium 2/3", id: chromium-2, browser: chromium, args: "--shard=2/3", save: false }
          - { name: "chromium 3/3", id: chromium-3, browser: chromium, args: "--shard=3/3", save: false }
          - { name: "webkit", id: webkit, browser: webkit, args: "--project=webkit", save: true }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The version that package-lock.json has locked, which is the one whose browsers are needed: a new version of Playwright is new browsers.
      # If the lock file has none the step fails here, and not later with a key of `Linux-ubuntu26.04-playwright-` that every run of every version
      # would share. The step reads the runner's Ubuntu release too, which the key names as well, and fails on an empty one for the same reason.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages?.['node_modules/@playwright/test']?.version ?? ''")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::No Playwright version in web/package-lock.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          os=$(. /etc/os-release && echo "$VERSION_ID")
          [[ -n $os ]] || { echo "::error::No VERSION_ID in /etc/os-release"; exit 1; }
          echo "os=$os" >> "$GITHUB_OUTPUT"

      # The browsers are downloaded (a few hundred megabytes) once for each version of Playwright, release of Ubuntu and browser, and kept. The key
      # names all three: Chromium's jobs and WebKit's install different things, and a key that both used would have whichever of them saved first.
      # Restored here and saved after the tests (Save the Playwright browsers), and not by one `actions/cache` step, which saves only when the whole job
      # passed: a run that fails in a test would then download the browsers again the next time, which is when it is run most.
      # A cache belongs to the branch whose run saved it. A run reads its own branch's and the default branch's (a pull request, its base's), never
      # another branch's, and GitHub removes one that has not been read for 7 days. So the first run on main after a merge, and the first after a
      # week without runs, is a miss: it installs the browsers and saves them again.
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu${{ steps.playwright.outputs.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install the browser
        id: install-browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # What the cache holds is the browser's files. The libraries that it needs (fonts, and for WebKit GStreamer, GTK and so on) are packages of the
      # system, which a fresh runner does not have: they are installed whether the browser came from the cache or not.
      # When this version of Playwright has no package list for the runner's Ubuntu, install-deps prints "Cannot install dependencies" and exits 0,
      # and the browser then fails to start for a library that is missing. The step fails on that message instead, where the cause is.
      - name: Install the system packages of the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          set -o pipefail
          npx playwright install-deps ${{ matrix.browser }} 2>&1 | tee install-deps.log
          if grep -q "Cannot install dependencies" install-deps.log; then
            echo "::error::Playwright cannot install the system packages for this runner's OS"
            exit 1
          fi

      # PW_WEBKIT adds the webkit project (see web/playwright.config.ts), which the WebKit job runs alone; the Chromium shards run without it, which is
      # the phone and desktop projects. The reporters are given here, over the config's: `list` for this job's log, and `blob` for the report that
      # e2e-report merges (the config's html reporter would write a report of this job's shard alone).
      - name: Run browser tests
        env:
          PW_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: npx playwright test ${{ matrix.args }} --reporter=list,blob

      # Whether the tests passed or not, but only when the browser was installed by this run and the install went through: a directory that a failed
      # download left half full must not be what the next run restores. (A hit has nothing new to save; a key that exists cannot be saved over.)
      # One job for each key (matrix.save): Chromium's three shards would all try to reserve the same one, and the others fail on it.
      - name: Save the Playwright browsers
        if: always() && matrix.save && steps.playwright-cache.outputs.cache-hit != 'true' && steps.install-browsers.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # The blob report of this job, which e2e-report merges: it holds the results and the traces of the tests that failed. Kept for a day only,
      # for the merged report is the one that is kept.
      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.id }}
          path: web/blob-report/
          retention-days: 1

  # One report of the four jobs, and only when one of them failed (as the single job's report was): the traces of the tests that failed are
  # what a red run is diagnosed from. It is not in the needs of build: whether the image is built is for the tests to say, and not for a report
  # that could not be made.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `merge-reports` is part of @playwright/test, at the version that the lock file has, which the blobs were written by.
      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: web/all-blob-reports
          merge-multiple: true

      - name: Merge the reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  build:
    needs: [test, web-checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # The image is always built, so that the Dockerfile is checked wherever the workflow runs; whether it is published (cosign, the login to the
    # registry, the push and the signature) is the one value below, and each of those steps follows it. By event:
    #   push of main                            publish   (the paths filter above decides which pushes run)
    #   push of a v*.*.* tag                    publish
    #   pull request                            build only
    #   manual run on main or on a v* tag       publish
    #   manual run on any other branch or tag   build only (a working branch is checked without an image of it on the registry)
    # The workflow's push triggers are main and the tags, so any `push` event is one of the first two.
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@main

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published docker image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}
