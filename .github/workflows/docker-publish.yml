name: Create Docker Image

on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
    paths:
      - src/**
      - tests/**
      - web/**
      - docker/dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldellisola/sporer

jobs:
  # Decides whether a version tag has to run the tests again. A v*.*.* tag publishes `latest`, which the server pulls daily, so the tests may be
  # skipped only for a commit that has already passed them: the owner tags a commit of main whose push run was green, and running it all again
  # for the same commit is about eight minutes of waiting for nothing. So `tested` is true only when this run is for a tag and this workflow
  # has a run on the tagged commit that tested it. A run counts only when all of these hold:
  #   - its conclusion is success (the --status filter);
  #   - its event is push or workflow_dispatch: a pull request run is listed under the PR's head commit, but it checked out and tested the merge
  #     of that commit with main, which is not the tagged tree;
  #   - its head SHA is the tagged commit (--commit is a filter of the server, and this is checked again here);
  #   - its ref is not a tag (headBranch holds the tag name for a run of a tag): a tag run may itself have skipped the tests because of an
  #     earlier run, and what proves the commit is the run that ran them, so the gate never rests on a skip;
  #   - it is not this run.
  # A commit with no such run (a docs-only commit on main never had a run, for the paths filter leaves it out; or the push run of main has not
  # finished yet) is not a failure: `tested` is false, and test, web-checks and e2e run as they do for any other event, and those take longer.
  # The query is made on every event, so that it is exercised on ordinary runs too, but only a tag acts on its answer. If the query itself
  # fails or hangs (an API error, or no answer in a minute), the answer is false and the tests run: a failure must never skip them, and a hang
  # must not fail the run. No checkout is needed: gh is told the repository with GH_REPO.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IS_TAG: ${{ github.ref_type == 'tag' }}
      REF_NAME: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Look for a successful run of this commit
        id: check
        run: |
          set -o pipefail
          tested=false
          if ! runs=$(timeout -k 5 60 gh run list --workflow docker-publish.yml --commit "$GITHUB_SHA" --status success --limit 100 \
                        --json databaseId,event,headSha,headBranch,conclusion \
                      | jq -r --arg sha "$GITHUB_SHA" --argjson id "$RUN_ID" \
                          '[.[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")
                                         and .headSha == $sha and .databaseId != $id
                                         and (.headBranch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+") | not))
                            | .databaseId | tostring] | join(",")'); then
            echo "The query for the runs of $GITHUB_SHA failed or took too long: the tests run."
          elif [[ -z $runs ]]; then
            if [[ $IS_TAG == true ]]; then
              echo "$REF_NAME is on $GITHUB_SHA, which has no successful push or manual run on a branch: the tests run."
            else
              echo "$GITHUB_SHA has no successful push or manual run on a branch. This is not a tag: the tests run."
            fi
          elif [[ $IS_TAG == true ]]; then
            echo "$REF_NAME is on $GITHUB_SHA, which passed in run ${runs%%,*}: the tests are skipped."
            tested=true
          else
            echo "$GITHUB_SHA passed in run ${runs%%,*}. This is not a tag: the tests run."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The integration tests start TimescaleDB with Testcontainers, which uses the Docker on the runner.
      - name: Run tests
        run: dotnet test src/Sporer.sln

  # The web app's checks, in three kinds of job that run at the same time: web-checks (types and unit tests), e2e (the browser tests, split in
  # four jobs) and, only when an e2e job failed or timed out, e2e-report (the one report of them all). The browser tests draw the map with
  # software WebGL (see web/playwright.config.ts), which needs no GPU, so the runner as it is will do. They run in Chromium, and a smoke set of
  # them (the tests tagged @smoke, a few of each flow) also in WebKit, the engine of the owner's iPhone.
  web-checks:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # The limit is for a run that hangs, which would otherwise sit for the six hours that a job is given; it is set far above what a green run
    # takes. Measured: the whole job took 51 s (`npm ci`, the type check and the unit tests).
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The e2e jobs run in Playwright's image, whose tag is written in this file (an expression in `container.image` cannot read a step's output),
      # and its browsers are the ones of that version of Playwright. A package.json moved to a new version with the tag left behind would run the
      # tests in browsers that Playwright does not expect, and fail with an error about a missing executable. This fails first, with the fix.
      - name: Check the Playwright image against the lock file
        run: |
          tag=$(grep -E '^[[:space:]]*image:' ../.github/workflows/docker-publish.yml \
                  | grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble' | sed -E 's/.*:v([0-9.]+)-noble$/\1/')
          lock=$(node -p "require('./package-lock.json').packages?.['node_modules/@playwright/test']?.version ?? ''")
          [[ $lock =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No Playwright version in web/package-lock.json"; exit 1; }
          [[ -n $tag && $tag != *$'\n'* ]] || { echo "::error::Not exactly one Playwright image (mcr.microsoft.com/playwright:v<version>-noble) in docker-publish.yml"; exit 1; }
          if [[ $tag != "$lock" ]]; then
            echo "::error::The Playwright image is v$tag but package-lock.json has $lock: update the image in docker-publish.yml to v$lock-noble"
            exit 1
          fi
          echo "Playwright $lock, image v$lock-noble"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  # The browser tests, in four jobs at once: Chromium's two projects (phone and desktop) in three shards, which Playwright cuts from the whole
  # list of tests (`--shard=i/3`; every test is in exactly one), and the WebKit smoke set in a job of its own. Each job has one worker (the config's
  # `workers` is 1 when CI is set): the verdict must not depend on how busy the runner is, and a job is a runner of its own, so the jobs do not
  # share processors. fail-fast is off: one red shard must not cancel the others, whose verdicts are as useful.
  e2e:
    name: e2e (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # Playwright's own image: the browsers and the libraries they need (fonts, and for WebKit GStreamer, GTK and so on) are in it, so no step
    # installs them, and nothing comes from Ubuntu's package mirror, whose speed varies a lot (it has run a WebKit install out of its limit three
    # times). The image is pulled from Microsoft's registry, which the runner reaches fast. The tag is the version of @playwright/test in
    # web/package-lock.json, written here because an expression in `image` cannot read a step's output: the web-checks job fails when the two
    # differ. A new version of Playwright is a new tag, changed together with package.json.
    # --user 1001 is Playwright's documented setup: the runner's own user, whose workspace the checkout then writes to. --ipc=host is what
    # Playwright recommends for Chromium in a container, whose default 64 MB of shared memory it can run short of.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble # must move with @playwright/test in web/package.json and package-lock.json
      options: --user 1001 --ipc=host
    # The limits are for a run that hangs (a browser that never answers), set well above what a green run takes. The test step has a limit of
    # its own, so that a step that is cut off is cut off alone: the steps after it still run, and the job is red, where a job that ran out of time
    # is cancelled with nothing uploaded. The step's limit stops only the shell, so Playwright would write no blob; its own --global-timeout
    # (9 minutes, under the step's 10) ends the run first and writes the blob of what ran, which the upload then takes to the report. The job's
    # limit is the pull of the image, `npm ci` and the tests, with headroom, and decides nothing.
    # Measured on the first run in the image: starting the container (the pull) 20 to 28 s, `npm ci` 3 s, the tests: Chromium 1/3 (88 phone
    # tests) 3.9 minutes, 2/3 (43 phone and 44 desktop tests) 3.2, 3/3 (87 desktop tests) 2.7, WebKit 0.5. A job is 1 to 5 minutes. The limit
    # of 20 leaves the tests their full 10 and the rest ten more.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # name is what the checks list shows, id is for the artifact (its name cannot hold a slash), browser is for the WebKit project, which
          # only the WebKit job turns on, and args is what is added to `playwright test`.
          - { name: "chromium 1/3", id: chromium-1, browser: chromium, args: "--shard=1/3" }
          - { name: "chromium 2/3", id: chromium-2, browser: chromium, args: "--shard=2/3" }
          - { name: "chromium 3/3", id: chromium-3, browser: chromium, args: "--shard=3/3" }
          - { name: "webkit", id: webkit, browser: webkit, args: "--project=webkit" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Node of this repository (package.json's engines), not whichever the image has: npm only warns when they differ.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PW_WEBKIT adds the webkit project (see web/playwright.config.ts), which the WebKit job runs alone; the Chromium shards run without it, which is
      # the phone and desktop projects. The reporters are given here, over the config's: `list` for this job's log, and `blob` for the report that
      # e2e-report merges (the config's html reporter would write a report of this job's shard alone).
      - name: Run browser tests
        timeout-minutes: 10
        env:
          PW_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: npx playwright test ${{ matrix.args }} --reporter=list,blob --global-timeout=540000

      # The blob report of this job, which e2e-report merges: it holds the results and the traces of the tests that failed. Kept for a day only,
      # for the merged report is the one that is kept.
      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.id }}
          path: web/blob-report/
          retention-days: 1

  # One report of the four jobs, and only when one of them failed or timed out (a job that is cut off by its limit ends as cancelled, not as
  # failure, and the others' failures should still have their report): the traces of the tests that failed are what a red run is diagnosed from.
  # `!cancelled()` is the run: a run that somebody cancels gets no report. It is not in the needs of build: whether the image is built is for
  # the tests to say, and not for a report that could not be made. When the gate skipped the tests, e2e is skipped, which is neither of the two
  # results, so there is no report.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `merge-reports` is part of @playwright/test, at the version that the lock file has, which the blobs were written by.
      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: web/all-blob-reports
          merge-multiple: true

      # Merges the blobs that there are: a job that failed before it ran a test, or that was cut off, uploaded none, and the others' are merged
      # without it. When there is none at all (the download of a pattern that matches nothing succeeds, and makes no directory) there is nothing to
      # merge, and the step says so and goes on, and not fail on the error of merge-reports that the directory is missing.
      - name: Merge the reports
        id: merge
        run: |
          if compgen -G "all-blob-reports/*.zip" > /dev/null; then
            npx playwright merge-reports --reporter html ./all-blob-reports
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "No blob report was uploaded (the e2e jobs failed before running a test), so there is no report to merge."
          fi

      - name: Upload the Playwright report
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # A skipped need skips its dependants unless the condition says otherwise, so the condition is written out. The image is built when the run
  # was not cancelled, the gate answered, and either the commit has already passed (a tag, see gate: the tests were skipped) or all three of
  # the test jobs succeeded. A red or cancelled test job blocks the image. A job that was skipped is not a success, so a skipped test job
  # blocks it too, except where the gate is what skipped them.
  build:
    needs: [gate, test, web-checks, e2e]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' && (
        needs.gate.outputs.tested == 'true' ||
        (needs.test.result == 'success' && needs.web-checks.result == 'success' && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # The image is always built, so that the Dockerfile is checked wherever the workflow runs; whether it is published (cosign, the login to the
    # registry, the push and the signature) is the one value below, and each of those steps follows it. By event:
    #   push of main                            publish   (the paths filter above decides which pushes run)
    #   push of a v*.*.* tag                    publish
    #   pull request                            build only
    #   manual run on main or on a v* tag       publish
    #   manual run on any other branch or tag   build only (a working branch is checked without an image of it on the registry)
    # The workflow's push triggers are main and the tags, so any `push` event is one of the first two.
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@main

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published docker image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}
