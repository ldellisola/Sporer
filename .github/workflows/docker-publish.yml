name: Create Docker Image

on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
    paths:
      - src/**
      - tests/**
      - web/**
      - docker/dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldellisola/sporer

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The integration tests start TimescaleDB with Testcontainers, which uses the Docker on the runner.
      - name: Run tests
        run: dotnet test src/Sporer.sln

  # The web app's checks: types, unit tests and the browser tests. The browser tests draw the map with software WebGL (see
  # web/playwright.config.ts), which needs no GPU, so the runner as it is will do. They run in Chromium, and a smoke set of them
  # (the tests tagged @smoke, a few of each flow) also in WebKit, the engine of the owner's iPhone.
  web:
    runs-on: ubuntu-latest
    # The limit is for a run that hangs (a browser that never answers), which would otherwise sit for the six hours that a job is given;
    # it is set above what a green run takes, not near it. Measured on the first run (a cache miss, Chromium's 234 tests and the WebKit smoke set
    # in one run): installing the browsers 34 s, the browser tests 10.8 minutes, the whole job 12.7 minutes. A hit on the cache saves most of the
    # 34 s. 20 minutes is about one and a half times the job; a runner that is slower than that one should say so in the numbers before the limit moves.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # The version that package-lock.json has locked, which is the one whose browsers are needed: a new version of Playwright is new browsers.
      # If the lock file has none the step fails here, and not later with a key of `Linux-playwright-` that every run of every version would share.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages?.['node_modules/@playwright/test']?.version ?? ''")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::No Playwright version in web/package-lock.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The browsers are downloaded (a few hundred megabytes) once for each version of Playwright, and kept. The key names the version and not
      # the browsers: if a browser is added to the installs below, the key has to change with it, or a hit would not have it.
      # Restored here and saved after the tests (Save the Playwright browsers), and not by one `actions/cache` step, which saves only when the whole job
      # passed: a run that fails in a test would then download the browsers again the next time, which is when it is run most.
      # A cache belongs to the branch whose run saved it. A run reads its own branch's and the default branch's (a pull request, its base's), never
      # another branch's, and GitHub removes one that has not been read for 7 days. So the first run on main after a merge, and the first after a
      # week without runs, is a miss: it installs the browsers and saves them again.
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install the browsers
        id: install-browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # What the cache holds is the browsers' files. The libraries that they need (fonts, GStreamer, GTK for WebKit and so on) are packages of the
      # system, which a fresh runner does not have: they are installed whether the browsers came from the cache or not.
      - name: Install the system packages of the cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # PW_WEBKIT adds the webkit project (see web/playwright.config.ts): the smoke set, in the same run and the same report as Chromium's tests.
      - name: Run browser tests
        env:
          PW_WEBKIT: "1"
        run: npm run e2e

      # Whether the tests passed or not, but only when the browsers were installed by this run and the install went through: a directory that a failed
      # download left half full must not be what the next run restores. (A hit has nothing new to save; a key that exists cannot be saved over.)
      - name: Save the Playwright browsers
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true' && steps.install-browsers.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # The report holds the traces of the tests that failed, which is what a red run is diagnosed from.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  build:
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # The image is always built, so that the Dockerfile is checked wherever the workflow runs; whether it is published (cosign, the login to the
    # registry, the push and the signature) is the one value below, and each of those steps follows it. By event:
    #   push of main                          publish   (the paths filter above decides which pushes run)
    #   push of a v*.*.* tag                  publish
    #   pull request                          build only
    #   manual run on main or on a v* tag     publish
    #   manual run on any other branch or tag build only (a working branch is checked without an image of it on the registry)
    # The workflow's push triggers are main and the tags, so any `push` event is one of the first two.
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@main

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published docker image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}
